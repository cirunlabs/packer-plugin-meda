name: Release Packer Plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Determine Go version
        id: go
        run: |
          if [ -f plugin/.go-version ]; then
            echo "version=$(cat plugin/.go-version)" >> $GITHUB_OUTPUT
          elif [ -f plugin/go.mod ]; then
            echo "version=$(grep '^go ' plugin/go.mod | awk '{print $2}')" >> $GITHUB_OUTPUT
          else
            echo "version=1.21" >> $GITHUB_OUTPUT
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
          workdir: plugin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}